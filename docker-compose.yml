version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpulse_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpulse-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudpulse-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=CloudPulse
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-cloudpulse-production-jwt-secret-key-capstone-2026}
      - DATABASE_URL=postgresql://cloudpulse:cloudpulse_secure_2026@postgres:5432/cloudpulse
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - backend_ml_models:/app/backend/app/ml/saved_models
    networks:
      - cloudpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpulse-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - cloudpulse-net

volumes:
  postgres_data:
  backend_ml_models:

networks:
  cloudpulse-net:
    driver: bridge
